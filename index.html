  :root{--bg:#0b0820;--ink:#fff7ff;--pink:#ff5fa8;--cyan:#5ff0ff;--gold:#ffd25f;--plum:#2a0f5c;--disp:"Titan One","Fredoka",sans-serif;--body:"Fredoka","Segoe UI",sans-serif}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
  html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;font-family:var(--body);font-weight:500;color:var(--ink)}
  canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  .overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:12px;overflow:auto;
    background:
      repeating-radial-gradient(circle at 50% 46%,transparent 0 78px,rgba(190,160,255,.08) 78px 80px),
      radial-gradient(circle at 50% 42%,rgba(70,30,140,.45),rgba(8,4,26,.93) 70%)}
  .overlay.show{display:flex;animation:fadein .35s ease both}
  @keyframes fadein{from{opacity:0;transform:scale(1.04)}to{opacity:1;transform:none}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

  /* ---- logo: chunky sticker lettering with two orbiting rings ---- */
  .logo{position:relative;padding:34px 70px;margin-bottom:6px}
  .logo h1{position:relative;z-index:2;margin:0;font-family:var(--disp);font-weight:400;font-size:clamp(46px,10vw,104px);line-height:.95;letter-spacing:2px;
    color:transparent;background:linear-gradient(180deg,#fff6c8 0%,#ffd25f 38%,#ff7ab8 70%,#c85bff 100%);-webkit-background-clip:text;background-clip:text;
    filter:drop-shadow(0 4px 0 #5a1480) drop-shadow(0 0 3px #2a0f5c) drop-shadow(0 0 26px rgba(255,95,168,.65));animation:bob 3.6s ease-in-out infinite}
  .logo h1 span{display:block}
  .logo h1 span+span{font-size:.62em;letter-spacing:12px;margin-top:2px}
  .orbit{position:absolute;left:50%;top:50%;border-radius:50%;pointer-events:none;border:2px dashed rgba(255,255,255,.28)}
  .orbit::after{content:"";position:absolute;top:-9px;left:50%;width:16px;height:16px;margin-left:-8px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#fff,var(--c) 55%,#0000 100%);box-shadow:0 0 16px var(--c),0 0 34px var(--c)}
  .o1{--c:#ff5fa8;left:-4%;right:-4%;top:-14%;bottom:-14%;animation:spin 11s linear infinite}
  .o2{--c:#5ff0ff;left:8%;right:8%;top:-42%;bottom:-42%;animation:spin 17s linear infinite reverse;border-color:rgba(95,240,255,.22)}

<script>
(() => {
"use strict";

/* ================================================================ CrazyGames SDK wrapper */
const CG = {
  ready:false, muted:false, gp:false,
  get sdk(){ return window.CrazyGames && window.CrazyGames.SDK; },
  async init(){
    try{
      if(!this.sdk) return;
      await this.sdk.init();
      this.ready = true;
      try{ this.muted = !!this.sdk.game.settings.muteAudio; }catch(e){}
      try{ this.sdk.game.addSettingsChangeListener(s => { this.muted = !!s.muteAudio; applyMute(); }); }catch(e){}
    }catch(e){ console.warn("CrazyGames SDK init failed", e); }
  },
  loadingStart(){ try{ this.ready && this.sdk.game.loadingStart(); }catch(e){} },
  loadingStop(){ try{ this.ready && this.sdk.game.loadingStop(); }catch(e){} },
  start(){ if(this.gp) return; this.gp=true; try{ this.ready && this.sdk.game.gameplayStart(); }catch(e){} },
  stop(){ if(!this.gp) return; this.gp=false; try{ this.ready && this.sdk.game.gameplayStop(); }catch(e){} },
  happy(){ try{ this.ready && this.sdk.game.happytime(); }catch(e){} },
  ad(type){ // true when finished (or no SDK in local dev); false on error/no-fill
    return new Promise(res => {
      if(!this.ready) return res(true);
      try{
        this.sdk.ad.requestAd(type, {
          adStarted: () => { adPlaying = true; applyMute(); },
          adFinished: () => { adPlaying = false; applyMute(); res(true); },
          adError: () => { adPlaying = false; applyMute(); res(false); }
        });
      }catch(e){ adPlaying = false; res(false); }
    });
  },
  async load(key){
    try{ if(this.ready) return this.sdk.data.getItem(key); }catch(e){}
    try{ return localStorage.getItem(key); }catch(e){ return null; }
  },
  save(key,val){
    try{ if(this.ready){ this.sdk.data.setItem(key,String(val)); return; } }catch(e){}
    try{ localStorage.setItem(key,String(val)); }catch(e){}
  }
};
let adPlaying = false, userMute = false;

/* ================================================================ setup / utils */
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
let C = ctx;                       // active draw context (swapped for menu portraits)
let W=0,H=0,DPR=1,Z=1;
let bgGrad=null;
function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2);
  W = innerWidth; H = innerHeight; Z = Math.max(.65, Math.min(1.25, Math.min(W,H)/760));
  cv.width = W*DPR; cv.height = H*DPR; bgGrad=null;
}
addEventListener("resize", resize); resize();

const $ = id => document.getElementById(id);
const rand=(a,b)=>a+Math.random()*(b-a), TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const pick1=a=>a[Math.floor(Math.random()*a.length)];

const ARENA = 1700;
let state="menu"; // menu | select | play | levelup | paused | over
let clock=0;

/* ================================================================ save data */
let save = {coins:0,best:0,unlocked:["bloom"],perks:{might:0,vit:0,greed:0},char:"bloom",runs:0,kills:0,tut:0};
function persist(){ CG.save("ob_save2", JSON.stringify(save)); }

/* ================================================================ audio */
let AC=null, master=null;
function audio(){
  if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); master = AC.createGain(); master.connect(AC.destination); applyMute(); }catch(e){} }
  if(AC && AC.state==="suspended") AC.resume();
}
function applyMute(){ if(master) master.gain.value = (CG.muted||adPlaying||userMute) ? 0 : 0.5; $("muteBtn").textContent=userMute?"✕":"♪"; $("pMute").textContent="SOUND: "+(userMute?"OFF":"ON"); }
function tone(f,d,type="sine",v=.15,slide=0){
  if(!AC||CG.muted||adPlaying||userMute) return;
  const o=AC.createOscillator(), g=AC.createGain(), t=AC.currentTime;
  o.type=type; o.frequency.setValueAtTime(f,t);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);
  g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g); g.connect(master); o.start(t); o.stop(t+d);
}
let lastHitSfx=0;
const sfx = {
  shoot:()=>tone(620,.08,"triangle",.04,-300),
  hit:()=>{ if(clock-lastHitSfx>.04){lastHitSfx=clock;tone(240,.07,"square",.04,-120);} },
  pop:()=>tone(420,.14,"sine",.1,380),
  gem:()=>tone(900+Math.random()*300,.07,"sine",.05),
  coin:()=>{tone(1200,.06,"square",.04);setTimeout(()=>tone(1600,.1,"square",.04),50);},
  hurt:()=>tone(150,.25,"sawtooth",.14,-90),
  zap:()=>tone(1400,.15,"sawtooth",.06,-1000),
  nova:()=>tone(200,.35,"sine",.14,500),
  boom:()=>tone(110,.4,"sawtooth",.16,-70),
  dash:()=>tone(300,.15,"triangle",.1,500),
  heal:()=>{tone(600,.12,"sine",.1);setTimeout(()=>tone(900,.18,"sine",.1),90);},
  level:()=>{tone(520,.15,"triangle",.14);setTimeout(()=>tone(780,.15,"triangle",.14),90);setTimeout(()=>tone(1040,.25,"triangle",.14),180);},
  boss:()=>{tone(90,.8,"sawtooth",.18,-30);setTimeout(()=>tone(70,.8,"sawtooth",.18,-20),300);}
};
let musicOn=false, mStep=0;
function musicLoop(){
  if(!musicOn) return;
  if(state==="play"&&AC&&!CG.muted&&!adPlaying&&!userMute){
    const sc=[0,3,5,7,10,12,15,17,19], root=[0,0,5,3][Math.floor(mStep/16)%4];
    const n=sc[(mStep*3+Math.floor(mStep/8))%sc.length]+root;
    tone(110*Math.pow(2,n/12),.35,"triangle",.045);
    if(mStep%4===0) tone(55*Math.pow(2,root/12),.5,"sine",.07);
    if(mStep%2===1&&time>60) tone(220*Math.pow(2,(sc[(mStep*5)%sc.length]+root)/12),.18,"sine",.025);
  }
  mStep++; setTimeout(musicLoop, clamp(250-time*.25,150,250));
}

/* ================================================================ sprite caches */
const glowCache={}, orbCache={};
function glowSprite(color){
  if(glowCache[color]) return glowCache[color];
  const s=document.createElement("canvas"); s.width=s.height=128;
  const g=s.getContext("2d"), gr=g.createRadialGradient(64,64,0,64,64,64);
  gr.addColorStop(0,color); gr.addColorStop(.35,color.replace(/[\d.]+\)$/,".35)")); gr.addColorStop(1,"rgba(0,0,0,0)");
  g.fillStyle=gr; g.fillRect(0,0,128,128);
  return glowCache[color]=s;
}
function glow(x,y,r,color,a=1){
  C.globalAlpha=a; C.globalCompositeOperation="lighter";
  C.drawImage(glowSprite(color),x-r,y-r,r*2,r*2);
  C.globalCompositeOperation="source-over"; C.globalAlpha=1;
}
function orbSprite(c1,c2,c3){
  const k=c1+c2+c3; if(orbCache[k]) return orbCache[k];
  const s=document.createElement("canvas"); s.width=s.height=128; const g=s.getContext("2d");
  const gr=g.createRadialGradient(46,42,6,64,64,60); gr.addColorStop(0,c1); gr.addColorStop(.5,c2); gr.addColorStop(1,c3);
  g.fillStyle=gr; g.beginPath(); g.arc(64,64,60,0,TAU); g.fill();
  const rl=g.createRadialGradient(64,64,36,64,64,60); rl.addColorStop(0,"rgba(255,255,255,0)"); rl.addColorStop(1,"rgba(255,255,255,.2)");
  g.fillStyle=rl; g.beginPath(); g.arc(64,64,60,0,TAU); g.fill();
  g.strokeStyle="rgba(0,0,0,.4)"; g.lineWidth=5; g.beginPath(); g.arc(64,64,58,0,TAU); g.stroke();
  g.fillStyle="rgba(255,255,255,.45)"; g.beginPath(); g.ellipse(46,30,24,10,-.5,0,TAU); g.fill();
  g.fillStyle="rgba(255,255,255,.1)"; g.beginPath(); g.ellipse(76,98,22,8,-.3,0,TAU); g.fill();
  return orbCache[k]=s;
}
function orb(x,y,r,c1,c2,c3){ const d=r*128/60; C.drawImage(orbSprite(c1,c2,c3),x-d/2,y-d/2,d,d); }
function shadow(x,y,r){ C.fillStyle="rgba(0,0,0,.28)"; C.beginPath(); C.ellipse(x,y+r*.9,r*.95,r*.36,0,0,TAU); C.fill(); }
function eyes(x,y,r,tx,ty,sep=.36,size=.27,col="#fff",pc="#1a0f3a"){
  const a=Math.atan2(ty-y,tx-x), ca=Math.cos(a), sa=Math.sin(a);
  for(const s of[-1,1]){
    const ex=x+s*r*sep+ca*r*.12, ey=y+sa*r*.1;
    C.fillStyle=col; C.beginPath(); C.arc(ex,ey,r*size,0,TAU); C.fill();
    C.fillStyle=pc; C.beginPath(); C.arc(ex+ca*r*size*.42,ey+sa*r*size*.42,r*size*.58,0,TAU); C.fill();
    C.fillStyle="#fff"; C.beginPath(); C.arc(ex+ca*r*size*.42-r*.05,ey+sa*r*size*.42-r*.07,r*size*.2,0,TAU); C.fill();
  }
}

function curChar(){ return CHARS.find(c=>c.id===save.char)||CHARS[0]; }

function recalc(){
  const ch=curChar(), p=P.passives, pk=save.perks;
  const old=P.maxHp||0;
  P.dmgM=(1+.15*(p.might||0))*(1+(ch.dmg||0))*(1+.05*pk.might);
  P.cdM=Math.max(.4,1-.08*(p.haste||0)-(ch.haste||0));
  P.maxHp=ch.hp+25*(p.vigor||0)+10*pk.vit;
  if(old) P.hp+=P.maxHp-old;
  P.speed=ch.spd*(1+.08*(p.swift||0));
  P.magnet=110+60*(p.magnet||0);
  P.armor=Math.min(.6,.08*(p.armor||0)+(ch.armor||0));
  P.crit=.05+.07*(p.lucky||0)+(ch.crit||0);
  P.xpM=(1+.12*(p.growth||0)+(ch.xp||0))*(1+.1*pk.greed);
  P.regen=.3*(p.vigor||0);
}
function addWeapon(id){ P.weapons[id]=(P.weapons[id]||0)+1; wst[id]=wst[id]||{t:rand(0,.4),ang:0,tick:0}; }

function reset(){
  const ch=curChar();
  P={x:0,y:0,vx:0,vy:0,r:22,hp:1,maxHp:0,lvl:1,xp:0,need:6,inv:0,look:0,hurt:0,dx:1,dy:0,dashT:0,dashCd:0,walk:0,yaw:0,tyaw:0,weapons:{},passives:{}};
  wst={}; for(const w of ch.w) addWeapon(w);
  recalc(); P.hp=P.maxHp;
  enemies=[];ebul=[];bullets=[];pickups=[];parts=[];rings=[];texts=[];bolts=[];decals=[];bubs=[];chaks=[];meteors=[];novas=[];trail=[];
  time=0;kills=0;shake=0;spawnT=0;bossT=60;swarmT=50;bosses=0;revived=false;runCoins=0;pending=0;rerolls=2;flash=0;banner=null;gemCount=0;nextId=1;wantDash=false;
  cam={x:0,y:0}; setTheme(0);
  if(!bgDust){ bgDust=[]; for(let i=0;i<70;i++) bgDust.push({x:rand(-1,1),y:rand(0,1),s:rand(.8,2.6),t:rand(0,TAU),v:rand(8,24),d:rand(.2,.8)});

}

/* ================================================================ spawning */
function spawnAt(type,x,y,o={}){
  const T=ET[type], sc=1+time/75, boss=type.startsWith("boss");
  const e={id:nextId++,t:type,x,y,vx:o.vx||0,vy:o.vy||0,r:T.r,hp:T.hp*sc*(boss?1+bosses*.5:1),max:0,sp:T.sp*(1+Math.min(time/420,.5)),dmg:T.dmg*(1+Math.min(time/600,.6)),
    xp:T.xp,flash:0,ph:rand(0,TAU),hcd:0,rot:rand(0,TAU),age:0,cd:rand(1,2.2),st:0,tm:0,sh:type==="boss"?3.5:0,sum:6,dc:4,dirx:0,diry:0,elite:false,dead:false,slam:0,slT:0};
  if(!boss&&type!=="mini"&&time>100&&Math.random()<.04){e.elite=true;e.hp*=3;e.r*=1.25;e.xp*=3;e.dmg*=1.3;}
  e.max=e.hp; enemies.push(e); return e;
}
function viewR(){ return Math.hypot(W,H)/(2*Z)+70; }
function spawn(type,ang){
  const a=ang===undefined?rand(0,TAU):ang, d=viewR();
  let x=P.x+Math.cos(a)*d, y=P.y+Math.sin(a)*d;
  const m=Math.hypot(x,y), lim=ARENA-30; if(m>lim){ x*=lim/m; y*=lim/m; }
  return spawnAt(type,x,y);
}
function pickType(){
  const pool=[["slime",10]];
  if(time>10) pool.push(["spiky",6]);
  if(time>30) pool.push(["tank",3]);
  if(time>40) pool.push(["bat",5]);
  if(time>55) pool.push(["splitter",3]);
  if(time>70) pool.push(["shooter",3]);
  if(time>90) pool.push(["dasher",3]);
  let tot=0; for(const p of pool) tot+=p[1]; let r=Math.random()*tot;
  for(const p of pool){ r-=p[1]; if(r<=0) return p[0]; } return "slime";
}
function burst(x,y,n,c,sp=220,life=.6,size=4){
  for(let i=0;i<n;i++){const a=rand(0,TAU),s=rand(sp*.3,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:life*rand(.6,1),m:life,s:rand(size*.5,size),c});}
}
function addText(x,y,t,crit,col){ if(texts.length>70) texts.shift(); texts.push({x:x+rand(-8,8),y,t,l:.75,c:col||(crit?"#ffe94f":"#fff"),s:crit?24:15}); }
function shootAt(e,sp,dmg,ang){
  const a=ang===undefined?Math.atan2(P.y-e.y,P.x-e.x):ang;
  ebul.push({x:e.x,y:e.y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,l:6,d:dmg,r:8});
}

/* ================================================================ damage / kill */
function nearest(x,y,max,used){
  let best=null,bd=max*max;
  for(const e of enemies){ if(e.dead||(used&&used.has(e))) continue; const d=(e.x-x)**2+(e.y-y)**2; if(d<bd){bd=d;best=e;} }
  return best;
}
function hit(e,base,kx=0,ky=0,kb=0,quiet=false){
  if(e.dead) return;
  let d=base*P.dmgM; const crit=Math.random()<P.crit; if(crit) d*=2;
  e.hp-=d; e.flash=.1;
  if(kb&&!e.t.startsWith("boss")){e.vx+=kx*kb;e.vy+=ky*kb;}
  if(!quiet||crit) addText(e.x,e.y-e.r,Math.round(d),crit);
  sfx.hit();
  if(e.hp<=0) kill(e);
}
function dropLoot(e){
  const T=ET[e.t], boss=e.t.startsWith("boss");
  const v=e.xp;
  if(gemCount>260) addXp(v*P.xpM); else pickups.push({k:"gem",x:e.x,y:e.y,v,t:rand(0,5),fly:false});
  const r=Math.random();
  if(Math.random()<(e.elite?.6:.09)) pickups.push({k:"coin",x:e.x+rand(-14,14),y:e.y+rand(-14,14),t:rand(0,5)});
  if(r<.012) pickups.push({k:"heart",x:e.x,y:e.y,t:0});
  else if(r<.018) pickups.push({k:"magnet",x:e.x,y:e.y,t:0});
  else if(r<.023) pickups.push({k:"bomb",x:e.x,y:e.y,t:0});
  if(e.elite) pickups.push({k:"heart",x:e.x,y:e.y,t:0});
  if(boss){
    for(let i=0;i<14;i++) pickups.push({k:"gem",x:e.x+rand(-60,60),y:e.y+rand(-60,60),v:5,t:rand(0,5),fly:false});
    for(let i=0;i<8;i++) pickups.push({k:"coin",x:e.x+rand(-70,70),y:e.y+rand(-70,70),t:rand(0,5)});
    pickups.push({k:"chest",x:e.x,y:e.y,t:0});
  }
}
function kill(e){
  e.dead=true; kills++; sfx.pop();
  const T=ET[e.t], boss=e.t.startsWith("boss");
  burst(e.x,e.y,boss?80:14,T.c[0],260,.7,5); burst(e.x,e.y,boss?40:7,T.c[1],200,.55,4);
  rings.push({x:e.x,y:e.y,r:e.r*.5,m:e.r*2.4,l:1,c:"255,255,255"});
  decals.push({x:e.x,y:e.y,r:e.r*rand(.9,1.5),c:T.c[1],a:.32,rot:rand(0,TAU)}); if(decals.length>70) decals.shift();
  dropLoot(e);
  if(e.t==="splitter") for(let i=0;i<2;i++) spawnAt("mini",e.x+rand(-10,10),e.y+rand(-10,10),{vx:rand(-240,240),vy:rand(-240,240)});
  if(boss){
    bosses++; P.hp=Math.min(P.maxHp,P.hp+30); CG.happy(); shake=26; flash=1; sfx.pop();
    for(const o of enemies) if(!o.dead&&o!==e&&o.t!=="boss"&&o.t!=="boss2") { o.hp=-1; o.dead=true; burst(o.x,o.y,6,ET[o.t].c[1],160,.4,3); }
    setTheme(bosses); banner={txt:"Entering "+theme.name,sub:"Boss defeated!",t:3.2};
  }
}

/* ================================================================ player hurt / xp */
function hurtPlayer(d,sx,sy){
  if(P.inv>0||state!=="play") return;
  d*=(1-P.armor); P.hp-=d; P.inv=.7; P.hurt=.4; shake=Math.max(shake,11); sfx.hurt();
  burst(P.x,P.y,12,"#ff6a8a",260,.5); addText(P.x,P.y-30,"-"+Math.round(d),false,"#ff7a9a");
  const k=Math.atan2(P.y-sy,P.x-sx); P.vx+=Math.cos(k)*380; P.vy+=Math.sin(k)*380;
  if(P.hp<=0) die();
}
function addXp(v){
  P.xp+=v;
  while(P.xp>=P.need){ P.xp-=P.need; P.lvl++; P.need=Math.round(P.need*1.22+4); pending++; }
}

/* ================================================================ weapons update */
const cdm=t=>t*P.cdM;
function updateWeapons(dt){
  const w=P.weapons;
  if(w.petals){
    const lv=w.petals,s=wst.petals; s.ang+=(2.2+.25*lv)*dt;
    const n=lv+1,orbit=78+lv*5,br=12+lv;
    for(let i=0;i<n;i++){
      const a=s.ang+i*TAU/n, bx=P.x+Math.cos(a)*orbit, by=P.y+Math.sin(a)*orbit;
      for(const e of enemies){ if(e.dead||e.hcd>0) continue;
        if((e.x-bx)**2+(e.y-by)**2<(e.r+br)**2){ e.hcd=.25; const k=Math.atan2(e.y-P.y,e.x-P.x); hit(e,9+3*lv,Math.cos(k),Math.sin(k),260); } }
    }
  }
  if(w.seeds){
    const lv=w.seeds,s=wst.seeds; s.t-=dt;
    if(s.t<=0){
      const t=nearest(P.x,P.y,640);
      if(t){
        s.t=cdm(.8-.08*lv); const n=1+(lv>=2?1:0)+(lv>=4?1:0), base=Math.atan2(t.y-P.y,t.x-P.x);
        for(let i=0;i<n;i++){const a=base+(i-(n-1)/2)*.17; bullets.push({x:P.x,y:P.y,vx:Math.cos(a)*640,vy:Math.sin(a)*640,l:1.2,d:11+3*lv,pierce:(lv>=3?1:0)+(lv>=5?1:0)});}
        sfx.shoot();
      } else s.t=.15;
    }
  }
  if(w.lightning){
    const lv=w.lightning,s=wst.lightning; s.t-=dt;
    if(s.t<=0){
      const first=nearest(P.x,P.y,480);
      if(first){
        s.t=cdm(1.5-.14*lv); const pts=[{x:P.x,y:P.y}], used=new Set(); let cur=first;
        for(let i=0;i<2+lv&&cur;i++){ used.add(cur); pts.push({x:cur.x,y:cur.y}); hit(cur,15+4*lv); cur=nearest(cur.x,cur.y,250,used); }
        bolts.push({pts,l:.2}); sfx.zap();
      } else s.t=.2;
    }
  }
  if(w.nova){
    const lv=w.nova,s=wst.nova; s.t-=dt;
    if(s.t<=0){ s.t=cdm(2.8-.3*lv); novas.push({r:10,max:140+22*lv,dmg:18+5*lv,hit:new Set()}); sfx.nova(); }
  }
  if(novas.length){
    for(const n of novas){ n.r+=560*dt;
      for(const e of enemies){ if(e.dead||n.hit.has(e)) continue; const d=Math.hypot(e.x-P.x,e.y-P.y);
        if(d<=n.r+e.r&&d>=n.r-60-e.r){ n.hit.add(e); hit(e,n.dmg,(e.x-P.x)/(d||1),(e.y-P.y)/(d||1),420); } } }
    novas=novas.filter(n=>n.r<n.max);
  }
  if(w.flame){
    const lv=w.flame,s=wst.flame,R=64+13*lv; s.tick-=dt;
    if(s.tick<=0){ s.tick=.35; for(const e of enemies){ if(!e.dead&&(e.x-P.x)**2+(e.y-P.y)**2<(R+e.r)**2) hit(e,5+2.4*lv,0,0,0,true); } }
    if(Math.random()<dt*60){ const a=rand(0,TAU),d=rand(R*.3,R); parts.push({x:P.x+Math.cos(a)*d,y:P.y+Math.sin(a)*d,vx:rand(-20,20),vy:rand(-90,-40),l:.5,m:.5,s:rand(4,9),c:pick1(["#ff9a3a","#ffd25f","#ff5a2a"])}); }
  }
  if(w.bubbles){
    const lv=w.bubbles,s=wst.bubbles; s.t-=dt;
    if(s.t<=0&&enemies.length){ s.t=cdm(2.6-.25*lv); const n=1+Math.floor(lv/2);
      for(let i=0;i<n;i++){const a=rand(0,TAU); bubs.push({x:P.x,y:P.y,vx:Math.cos(a)*140,vy:Math.sin(a)*140,r:16+1.5*lv,l:5,dmg:16+5*lv,hit:{},pc:3,sp:200+15*lv});} }
  }
  for(const b of bubs){
    const t=nearest(b.x,b.y,700);
    if(t){ const a=Math.atan2(t.y-b.y,t.x-b.x); b.vx+=(Math.cos(a)*b.sp-b.vx)*Math.min(1,dt*2.2); b.vy+=(Math.sin(a)*b.sp-b.vy)*Math.min(1,dt*2.2); }
    b.x+=b.vx*dt; b.y+=b.vy*dt; b.l-=dt;
    for(const e of enemies){ if(e.dead||b.l<=0) continue;
      if((e.x-b.x)**2+(e.y-b.y)**2<(e.r+b.r)**2 && time-(b.hit[e.id]||-9)>.5){ b.hit[e.id]=time; hit(e,b.dmg,b.vx/b.sp,b.vy/b.sp,200); burst(b.x,b.y,5,"#aaffee",140,.35,3); if(--b.pc<=0) b.l=0; } }
    if(b.l<=0) burst(b.x,b.y,12,"#bafff0",180,.5,4);
  }
  bubs=bubs.filter(b=>b.l>0);
  if(w.meteor){
    const lv=w.meteor,s=wst.meteor; s.t-=dt;
    if(s.t<=0){ s.t=cdm(3.2-.35*lv); const n=1+Math.ceil(lv/2);
      for(let i=0;i<n;i++){
        let t=null; for(let k=0;k<6&&!t;k++){ const c=enemies[Math.floor(Math.random()*enemies.length)]; if(c&&!c.dead&&Math.hypot(c.x-P.x,c.y-P.y)<650) t=c; }
        const x=t?t.x+t.vx*.5:P.x+rand(-260,260), y=t?t.y+t.vy*.5:P.y+rand(-260,260);
        meteors.push({x,y,t:.9,m:.9,r:70+9*lv,dmg:38+12*lv});
      } }
  }
  for(const m of meteors){ m.t-=dt;
    if(m.t<=0){ m.dead=true; sfx.boom(); shake=Math.max(shake,8);
      for(const e of enemies){ if(e.dead) continue; const d=Math.hypot(e.x-m.x,e.y-m.y); if(d<m.r+e.r) hit(e,m.dmg,(e.x-m.x)/(d||1),(e.y-m.y)/(d||1),300); }
      burst(m.x,m.y,28,"#ffb04a",320,.7,6); burst(m.x,m.y,14,"#fff1b0",200,.5,5); rings.push({x:m.x,y:m.y,r:10,m:m.r*1.2,l:1,c:"255,170,70"}); decals.push({x:m.x,y:m.y,r:m.r*.7,c:"#1a0a05",a:.45,rot:0}); } }
  meteors=meteors.filter(m=>!m.dead);
  if(w.chakram){
    const lv=w.chakram,s=wst.chakram; s.t-=dt;
    if(s.t<=0){ const t=nearest(P.x,P.y,700);
      if(t){ s.t=cdm(2.2-.2*lv); const n=1+Math.floor(lv/3), base=Math.atan2(t.y-P.y,t.x-P.x);
        for(let i=0;i<n;i++) chaks.push({x:P.x,y:P.y,a:base+(i-(n-1)/2)*.5,ph:0,d:0,max:260+25*lv,dmg:20+6*lv,rot:0,hit:{}}); sfx.shoot(); }
      else s.t=.2; }
  }
  for(const c of chaks){
    const sp=520*dt; c.rot+=dt*14;
    if(c.ph===0){ c.x+=Math.cos(c.a)*sp; c.y+=Math.sin(c.a)*sp; c.d+=sp; if(c.d>=c.max){c.ph=1;c.hit={};} }
    else { const a=Math.atan2(P.y-c.y,P.x-c.x); c.x+=Math.cos(a)*sp*1.2; c.y+=Math.sin(a)*sp*1.2; if(Math.hypot(P.x-c.x,P.y-c.y)<26) c.dead=true; }
    for(const e of enemies){ if(e.dead) continue;
      if((e.x-c.x)**2+(e.y-c.y)**2<(e.r+16)**2 && time-(c.hit[e.id]||-9)>.35){ c.hit[e.id]=time; hit(e,c.dmg,Math.cos(c.a),Math.sin(c.a),150); } }
  }
  chaks=chaks.filter(c=>!c.dead);
  for(const b of bullets){ b.x+=b.vx*dt; b.y+=b.vy*dt; b.l-=dt;
    for(const e of enemies){ if(b.l<=0) break; if(e.dead) continue;
      if((e.x-b.x)**2+(e.y-b.y)**2<(e.r+7)**2){ hit(e,b.d,b.vx/640,b.vy/640,90); burst(b.x,b.y,4,"#ffe9a8",140,.3,3); if(--b.pierce<0) b.l=0; } } }
  bullets=bullets.filter(b=>b.l>0);
  for(const b of bolts) b.l-=dt; bolts=bolts.filter(b=>b.l>0);
}

/* ================================================================ main update */
function update(dt){
  time+=dt;
  let ix=(keys.d||keys.ArrowRight?1:0)-(keys.a||keys.ArrowLeft?1:0), iy=(keys.s||keys.ArrowDown?1:0)-(keys.w||keys.ArrowUp?1:0);
  if(ptr.down){ const dx=ptr.x-ptr.sx, dy=ptr.y-ptr.sy, mm=Math.hypot(dx,dy); if(mm>12){const k=Math.min(mm/60,1)/mm;ix=dx*k;iy=dy*k;} }
  const m=Math.hypot(ix,iy); if(m>1){ix/=m;iy/=m;}
  if(m>.1){ P.look=Math.atan2(iy,ix); P.dx=ix/m; P.dy=iy/m; P.tyaw=Math.atan2(ix,iy); }
  { let d=P.tyaw-P.yaw; d=Math.atan2(Math.sin(d),Math.cos(d)); P.yaw+=d*Math.min(1,dt*12); }
  P.dashCd=Math.max(0,P.dashCd-dt);
  if(wantDash){ wantDash=false;
    if(P.dashCd<=0&&P.dashT<=0){ P.dashT=.18; P.dashCd=1.6; P.inv=Math.max(P.inv,.35); P.vx=P.dx*740; P.vy=P.dy*740; sfx.dash(); burst(P.x,P.y,10,"#bff",200,.3,4); } }
  if(P.dashT>0){ P.dashT-=dt; trail.push({x:P.x,y:P.y,l:.3}); }
  else { P.vx+=(ix*P.speed-P.vx)*Math.min(1,dt*12); P.vy+=(iy*P.speed-P.vy)*Math.min(1,dt*12); }
  P.x+=P.vx*dt; P.y+=P.vy*dt; P.walk+=Math.hypot(P.vx,P.vy)*dt*.045;
  const pm=Math.hypot(P.x,P.y); if(pm>ARENA-P.r){P.x*=(ARENA-P.r)/pm;P.y*=(ARENA-P.r)/pm;}
  P.inv=Math.max(0,P.inv-dt); P.hurt=Math.max(0,P.hurt-dt);
  P.hp=Math.min(P.maxHp,P.hp+P.regen*dt);
  cam.x+=(P.x-cam.x)*Math.min(1,dt*7); cam.y+=(P.y-cam.y)*Math.min(1,dt*7);
  shake=Math.max(0,shake-dt*30); flash=Math.max(0,flash-dt*1.5);
  if(banner){banner.t-=dt;if(banner.t<=0)banner=null;}

  // spawning
  spawnT-=dt;
  if(spawnT<=0){
    spawnT=Math.max(.12,.75-time/150);
    const n=1+Math.floor(time/45);
    for(let i=0;i<n&&enemies.length<240;i++) spawn(pickType());
  }
  bossT-=dt;
  if(bossT<=0){ bossT=75; spawn(bosses%2?"boss2":"boss",rand(0,TAU)); rings.push({x:P.x,y:P.y,r:10,m:900,l:1,c:"255,210,90"}); sfx.boss(); shake=14; banner={txt:"BOSS INCOMING",sub:"",t:2.5}; }
  swarmT-=dt;
  if(swarmT<=0){ swarmT=75; const t=pick1(["slime","bat","spiky"]), n=22;
    for(let i=0;i<n;i++) spawn(t,i*TAU/n); banner={txt:"SWARM!",sub:"Break the circle",t:2.2}; sfx.boss(); }

  // enemies
  for(const e of enemies){
    if(e.dead) continue;
    const T=ET[e.t], boss=e.t.startsWith("boss");
    const dx=P.x-e.x, dy=P.y-e.y, d=Math.hypot(dx,dy)||1;
    e.ph+=dt*6; e.rot+=dt*(e.t==="spiky"?3:.6); e.flash=Math.max(0,e.flash-dt); e.hcd=Math.max(0,e.hcd-dt); e.age+=dt;
    let tx=dx/d, ty=dy/d, sp=e.sp, k=3;
    if(e.t==="bat"){ const s=Math.sin(e.ph*.6)*.9; tx+=-dy/d*s; ty+=dx/d*s; }
    else if(e.t==="shooter"){
      if(d<230){tx=-tx;ty=-ty;} else if(d<340){const px=-ty,py=tx;tx=px;ty=py;sp*=.6;}
      e.cd-=dt; if(e.cd<=0&&d<560){e.cd=2.3;shootAt(e,230,e.dmg);}
    }
    else if(e.t==="dasher"||e.t==="boss2"){
      const wind=e.t==="boss2"?.9:.7, dur=e.t==="boss2"?.6:.45, dsp=e.t==="boss2"?560:620, cdr=e.t==="boss2"?4.5:2.2, rng=e.t==="boss2"?9999:380;
      if(e.st===0){ e.dc-=dt; if(e.dc<=0&&d<rng){e.st=1;e.tm=wind;e.dirx=dx/d;e.diry=dy/d;} }
      else if(e.st===1){ sp=0;tx=ty=0;k=10;e.tm-=dt; if(e.tm<=0){e.st=2;e.tm=dur;} }
      else { tx=e.dirx;ty=e.diry;sp=dsp;k=14;e.tm-=dt; if(e.tm<=0){e.st=0;e.dc=cdr;} }
      if(e.t==="boss2"){ e.sum-=dt; if(e.sum<=0){ e.sum=8; for(let i=0;i<5;i++){ const a=i*TAU/5; spawnAt("bat",e.x+Math.cos(a)*(e.r+24),e.y+Math.sin(a)*(e.r+24)); } } }
    }
    else if(e.t==="boss"){
      e.sh-=dt;
      if(e.slam===1){ sp=0; tx=ty=0; k=10; e.slT-=dt;
        if(e.slT<=0){ e.slam=0; e.sh=5.5; sfx.boom(); shake=Math.max(shake,18); rings.push({x:e.x,y:e.y,r:10,m:e.r*2.4,l:1,c:"255,120,80"}); burst(e.x,e.y,36,"#ffb04a",340,.7,6);
          if(Math.hypot(P.x-e.x,P.y-e.y)<e.r*2.4+P.r) hurtPlayer(e.dmg*1.2,e.x,e.y); } }
      else if(e.sh<=0){ e.slam=1; e.slT=1; }
      e.sum-=dt; if(e.sum<=0){ e.sum=9; for(let i=0;i<6;i++){const a=i*TAU/6; spawnAt("slime",e.x+Math.cos(a)*(e.r+30),e.y+Math.sin(a)*(e.r+30));} }
    }
    e.vx+=(tx*sp-e.vx)*Math.min(1,dt*k); e.vy+=(ty*sp-e.vy)*Math.min(1,dt*k);
    e.x+=e.vx*dt; e.y+=e.vy*dt;
    const em=Math.hypot(e.x,e.y), lim=ARENA-e.r; if(em>lim){e.x*=lim/em;e.y*=lim/em;}
    if(d<e.r+P.r-4) hurtPlayer(e.dmg,e.x,e.y);
    if(state!=="play") return;
  }
  for(let i=0;i<enemies.length;i++){ const a=enemies[i]; if(a.dead) continue;
    for(let j=i+1;j<enemies.length&&j<i+14;j++){ const b=enemies[j]; if(b.dead) continue;
      const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy),mn=a.r+b.r-6;
      if(d<mn&&d>.01){const f=(mn-d)*.5/d;a.x-=dx*f;a.y-=dy*f;b.x+=dx*f;b.y+=dy*f;} } }

  // enemy bullets
  for(const b of ebul){ b.x+=b.vx*dt;b.y+=b.vy*dt;b.l-=dt;
    if((b.x-P.x)**2+(b.y-P.y)**2<(b.r+P.r-2)**2){ b.l=0; hurtPlayer(b.d,b.x-b.vx,b.y-b.vy); if(state!=="play") return; }
    if(Math.hypot(b.x,b.y)>ARENA+40) b.l=0; }
  ebul=ebul.filter(b=>b.l>0);

  updateWeapons(dt);
  enemies=enemies.filter(e=>!e.dead);

  // pickups
  gemCount=0;
  for(const g of pickups){
    g.t+=dt; const dx=P.x-g.x,dy=P.y-g.y,d=Math.hypot(dx,dy)||1;
    const small=g.k==="gem"||g.k==="coin";
    if(small){ if(d<P.magnet||g.fly){ g.fly=true; const s=440+Math.max(0,P.magnet-d)*2; g.x+=dx/d*s*dt; g.y+=dy/d*s*dt; } if(g.k==="gem") gemCount++; }
    else if(d<P.magnet*.5){ g.x+=dx/d*160*dt; g.y+=dy/d*160*dt; }
    if(d<P.r+(small?6:14)){
      g.dead=true;
      switch(g.k){
        case"gem": addXp(g.v*P.xpM); sfx.gem(); break;
        case"coin": runCoins++; sfx.coin(); break;
        case"heart": P.hp=Math.min(P.maxHp,P.hp+25); sfx.heal(); addText(P.x,P.y-34,"+25",false,"#7aff9a"); burst(P.x,P.y,10,"#ff9ab5",160,.5); break;
        case"magnet": for(const o of pickups) if(o.k==="gem"||o.k==="coin") o.fly=true; rings.push({x:P.x,y:P.y,r:10,m:500,l:1,c:"200,140,255"}); sfx.heal(); break;
        case"bomb": sfx.boom(); shake=18; rings.push({x:P.x,y:P.y,r:10,m:viewR(),l:1,c:"255,120,80"});
          for(const e of enemies) if(!e.dead&&Math.hypot(e.x-P.x,e.y-P.y)<viewR()) hit(e,70,(e.x-P.x),(e.y-P.y),0.01); break;
        case"chest": pending++; sfx.heal(); banner={txt:"TREASURE!",sub:"Free upgrade",t:1.6}; burst(g.x,g.y,30,"#ffd25f",300,.8,5); break;
      }
    }
  }
  pickups=pickups.filter(g=>!g.dead);

  for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.94;p.vy*=.94;p.l-=dt;}
  parts=parts.filter(p=>p.l>0); if(parts.length>700) parts.splice(0,parts.length-700);
  for(const r of rings){r.l-=dt*1.6;r.r+=(r.m-r.r)*dt*4;} rings=rings.filter(r=>r.l>0);
  for(const t of texts){t.y-=40*dt;t.l-=dt;} texts=texts.filter(t=>t.l>0);
  for(const t of trail) t.l-=dt; trail=trail.filter(t=>t.l>0);
  for(const d of decals) d.a=Math.max(.06,d.a-dt*.004);

  if(pending>0&&state==="play") openLevel();
}

/* ================================================================ level-up cards */
function buildOptions(){
  const o=[], wc=Object.keys(P.weapons).length, pc=Object.keys(P.passives).length;
  for(const id in WEAPONS){ const lv=P.weapons[id]||0; if(lv>0&&lv<5) o.push({kind:"w",id,lv}); else if(lv===0&&wc<5) o.push({kind:"w",id,lv:0}); }
  for(const id in PASSIVES){ const lv=P.passives[id]||0; if(lv>0&&lv<5) o.push({kind:"p",id,lv}); else if(lv===0&&pc<5) o.push({kind:"p",id,lv:0}); }
  o.sort(()=>Math.random()-.5);
  const out=o.slice(0,3);
  if(!out.length) out.push({kind:"heal"});
  return out;
}
function openLevel(){
  pending--; sfx.level(); CG.happy(); rings.push({x:P.x,y:P.y,r:20,m:280,l:1,c:"255,220,120"});
  state="levelup"; CG.stop();
  $("luTitle").textContent="Level "+P.lvl+"!"; showCards(); $("levelup").classList.add("show");
}
function showCards(){
  const box=$("cards"); box.innerHTML=""; const opts=buildOptions();
  opts.forEach((u,i)=>{
    const d=document.createElement("div"); d.className="card";
    let icon,name,desc,lvl,col;
    if(u.kind==="heal"){ icon="♥";name="Bloom Feast";desc="Heal 50% HP & gain 50 coins";lvl="";col="#ff6a9a"; }
    else { const def=u.kind==="w"?WEAPONS[u.id]:PASSIVES[u.id]; icon=def.icon;name=def.name;col=def.col;
      desc=u.lv===0?def.desc:(u.kind==="w"?def.up:def.desc); lvl=u.lv===0?"NEW":`Lv ${u.lv} → ${u.lv+1}`; }
    d.style.setProperty("--cb",col); d.style.setProperty("--cc",col+"88");
    d.innerHTML=`${u.lv===0&&u.kind!=="heal"?'<div class="tag">NEW '+(u.kind==="w"?"WEAPON":"PASSIVE")+'</div>':""}<b>${icon}</b><span>${i+1}. ${name}</span><em>${lvl}</em><small>${desc}</small>`;
    d.onclick=()=>choose(u); d._u=u; box.appendChild(d);
  });
  $("reroll").textContent=`↻ Reroll (${rerolls})`; $("reroll").disabled=rerolls<=0;
}
function choose(u){
  if(state!=="levelup") return;
  if(u.kind==="w") addWeapon(u.id);
  else if(u.kind==="p"){ P.passives[u.id]=(P.passives[u.id]||0)+1; recalc(); if(u.id==="vigor") P.hp=Math.min(P.maxHp,P.hp+25); }
  else { P.hp=Math.min(P.maxHp,P.hp+P.maxHp*.5); runCoins+=50; }
  $("levelup").classList.remove("show"); state="play"; CG.start();
  if(pending>0) openLevel();
}
$("reroll").onclick=()=>{ if(rerolls>0&&state==="levelup"){ rerolls--; showCards(); } };

/* ================================================================ run flow */
let lastResult=null;
function die(){
  if(state!=="play") return;
  state="over"; CG.stop(); shake=22; burst(P.x,P.y,60,"#ff9ad5",380,1,6); sfx.hurt();
  const score=Math.floor(kills*10+time*2+bosses*500);
  const nb=score>save.best; if(nb) save.best=score;
  const greed=1+.1*save.perks.greed, coins=Math.floor((runCoins+Math.floor(time/20)+bosses*15)*greed);
  save.tut++; save.coins+=coins; save.runs++; save.kills+=kills; persist();
  lastResult={coins,doubled:false};
  $("sum").innerHTML=`Score <b>${score}</b> &bull; Level ${P.lvl} &bull; ${kills} popped &bull; ${Math.floor(time/60)}:${String(Math.floor(time%60)).padStart(2,"0")}`;
  $("coinSum").textContent=`+${coins} coins  (total ${save.coins})`;
  $("newbest").textContent=nb?"★ New best! ★":"";
  $("revive").style.display=revived?"none":""; $("double").style.display=""; $("double").disabled=false;
  setTimeout(()=>{ if(state==="over") $("over").classList.add("show"); },800);
}
function hideAll(){ for(const id of["menu","select","levelup","pause","over"]) $(id).classList.remove("show"); }

async function startRun(){
  audio(); hideAll(); reset(); state="paused-ad"; setHud(false);

  state="play"; CG.start(); setHud(true);

}

function refreshMenu(){ $("menuStats").innerHTML=`🪙 ${save.coins} &nbsp;•&nbsp; Best ${save.best} &nbsp;•&nbsp; Hero: ${curChar().name}`; }
function pause(){ if(state!=="play") return; state="paused"; CG.stop(); $("pause").classList.add("show"); }

$("play").onclick=startRun; $("again").onclick=startRun; $("toMenu").onclick=toMenu;

$("muteBtn").onclick=()=>{ userMute=!userMute; applyMute(); };
$("pMute").onclick=()=>{ userMute=!userMute; applyMute(); };
$("revive").onclick=async()=>{
  $("over").classList.remove("show"); const prev=state; state="paused-ad";
  const ok=await CG.ad("rewarded");
  if(ok){ revived=true; save.coins-=lastResult.coins; persist(); lastResult=null; P.hp=P.maxHp*.6; P.inv=2.5;
    for(const e of enemies) if(Math.hypot(e.x-P.x,e.y-P.y)<360&&!e.t.startsWith("boss")) e.dead=true;
    enemies=enemies.filter(e=>!e.dead); ebul=[]; rings.push({x:P.x,y:P.y,r:10,m:360,l:1,c:"120,240,255"}); state="play"; CG.start(); }

const portraits=[];

const PERK_COST=[100,200,350,550,800];
function renderSelect(){
  $("coinsLbl").textContent="🪙 "+save.coins;

    d.appendChild(cvs);
    d.insertAdjacentHTML("beforeend",`<b>${ch.name}</b><small>${ch.desc}</small><div class="st">${save.char===ch.id?"SELECTED":own?"TAP TO SELECT":"🔒 "+ch.cost+" coins"}</div>`);
    d.onclick=()=>{
      if(own){ save.char=ch.id; }
      else if(save.coins>=ch.cost){ save.coins-=ch.cost; save.unlocked.push(ch.id); save.char=ch.id; sfx.level(); }
      else { d.style.transform="translateX(6px)"; return; }

function drawPortraits(){

/* ================================================================ input */
addEventListener("keydown",e=>{
  audio();
  if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key)) e.preventDefault();
  const k=e.key.length===1?e.key.toLowerCase():e.key; keys[k]=true;
  if((k===" "||k==="Shift")&&state==="play") wantDash=true;
  if(state==="levelup"){ if("123".includes(e.key)){const c=$("cards").children[+e.key-1]; c&&c._u&&choose(c._u);} if(k==="r") $("reroll").onclick(); }
  if(state==="menu"&&(e.key==="Enter")) startRun();
  if(k==="p"||k==="Escape"){ if(state==="play") pause(); else if(state==="paused") resume(); }
  if(k==="m"){ userMute=!userMute; applyMute(); }
});

/* ================================================================ drawing: characters */
function flameShape(x,y,w,h,col){
  C.fillStyle=col; C.beginPath(); C.moveTo(x-w,y); C.quadraticCurveTo(x-w*1.1,y-h*.5,x,y-h); C.quadraticCurveTo(x+w*1.1,y-h*.5,x+w,y); C.closePath(); C.fill();
}
/* ================================================================ 3D heroes (Three.js, rendered offscreen then blitted into the 2D game) */
const H3D={ok:false,cv:null,r:null,scene:null,cam:null,heroes:{},unitFrac:.2,fy:.8,hurtL:null,
  init(){
    try{
      if(typeof THREE==="undefined") return;
      const T=THREE, SZ=288;
      const r=new T.WebGLRenderer({antialias:true,alpha:true});
      r.setPixelRatio(1); r.setSize(SZ,SZ,false); r.setClearColor(0x000000,0);
      r.shadowMap.enabled=true; r.shadowMap.type=T.PCFSoftShadowMap;
      r.toneMapping=T.ACESFilmicToneMapping; r.toneMappingExposure=.82;
      this.r=r; this.cv=r.domElement;
      const scene=new T.Scene(); this.scene=scene;
      // procedural studio environment so glossy / metallic materials have something to reflect
      const pm=new T.PMREMGenerator(r), env=new T.Scene();
      env.add(new T.Mesh(new T.SphereGeometry(10,32,16),new T.ShaderMaterial({side:T.BackSide,
        vertexShader:"varying vec3 vP;void main(){vP=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}",
        fragmentShader:"varying vec3 vP;void main(){float h=normalize(vP).y;vec3 top=vec3(.8,.72,1.),mid=vec3(.45,.32,.75),bot=vec3(.16,.1,.3);vec3 c=h>0.?mix(mid,top,h):mix(mid,bot,-h);gl_FragColor=vec4(c,1.);}"})));
      for(const [x,y,z,w,h,c] of [[-4,4,5,5,3,0xffffff],[5,2,3,3,5,0xffd9f0],[0,5,-5,6,2,0x9fe8ff]]){
        const p=new T.Mesh(new T.PlaneGeometry(w,h),new T.MeshBasicMaterial({color:c,side:T.DoubleSide})); p.position.set(x,y,z); p.lookAt(0,1,0); env.add(p); }
      scene.environment=pm.fromScene(env,.03).texture;

function drawPlayer(){
  const ch=curChar();

  C.strokeStyle="rgba(255,255,255,.1)"; C.lineWidth=2; C.beginPath(); C.arc(P.x,P.y,P.magnet,0,TAU); C.stroke();
  if(P.weapons.petals){ const lv=P.weapons.petals,s=wst.petals,n=lv+1,orbit=78+lv*5,br=12+lv;
    C.strokeStyle="rgba(255,255,255,.12)"; C.setLineDash([6,10]); C.beginPath(); C.arc(P.x,P.y,orbit,0,TAU); C.stroke(); C.setLineDash([]);

      C.restore(); orb(bx,by,br*.5,"#fff8c0","#ffd25f","#e08a20"); } }

    const cvs=H3D.render(ch.id,{yaw:P.yaw,walk:P.walk,mv:mvv,t:clock,hurt:P.hurt}), D=H3D.drawSize(P.r*1.15), off=P.r*1.2-D*H3D.fy, keep=C.globalAlpha;

function drawPickup(g){
  if(!vis(g.x,g.y,40)) return;
  const bob=Math.sin(g.t*5)*2.5;
  if(g.k==="gem"){ const c=g.v<=1?["#e8ffff","#5ff0ff","#1a8aa8"]:g.v<=4?["#fffbd0","#ffd25f","#e8902a"]:g.v<=10?["#ffe0f2","#ff7ac0","#a8246a"]:["#f0e0ff","#c08cff","#5a2aa8"];
    glow(g.x,g.y+bob,22+Math.min(g.v,8),`rgba(${c===0?0:255},230,160,.7)`,.7); orb(g.x,g.y+bob,5.5+Math.min(g.v,6)*.5,c[0],c[1],c[2]); }
  else if(g.k==="coin"){ const s=Math.abs(Math.cos(g.t*4)); glow(g.x,g.y+bob,20,"rgba(255,215,80,.8)",.6);
    C.fillStyle="#b8741a"; C.beginPath(); C.ellipse(g.x,g.y+bob,9*s+1,9,0,0,TAU); C.fill(); C.fillStyle="#ffd25f"; C.beginPath(); C.ellipse(g.x,g.y+bob,7*s+.5,7,0,0,TAU); C.fill(); }
  else if(g.k==="heart"){ glow(g.x,g.y+bob,36,"rgba(255,90,140,.8)",.8); orb(g.x-5,g.y+bob-2,7,"#ffd0dc","#ff4f7e","#a0124a"); orb(g.x+5,g.y+bob-2,7,"#ffd0dc","#ff4f7e","#a0124a");
    C.fillStyle="#ff4f7e"; C.beginPath(); C.moveTo(g.x-11,g.y+bob); C.lineTo(g.x,g.y+bob+13); C.lineTo(g.x+11,g.y+bob); C.fill(); }
  else if(g.k==="magnet"){ glow(g.x,g.y+bob,40,"rgba(190,130,255,.8)",.8); C.strokeStyle="#c08cff"; C.lineWidth=7; C.beginPath(); C.arc(g.x,g.y+bob,10,Math.PI*.15,Math.PI*.85,true); C.stroke(); C.fillStyle="#fff"; C.fillRect(g.x-14,g.y+bob-3,6,5); C.fillRect(g.x+8,g.y+bob-3,6,5); }
  else if(g.k==="bomb"){ glow(g.x,g.y+bob,40,"rgba(255,120,60,.8)",.7); orb(g.x,g.y+bob,12,"#888","#333","#111"); C.strokeStyle="#ffd25f"; C.lineWidth=3; C.beginPath(); C.moveTo(g.x+6,g.y+bob-10); C.quadraticCurveTo(g.x+12,g.y+bob-20,g.x+18,g.y+bob-14); C.stroke(); glow(g.x+18,g.y+bob-14,12,"rgba(255,220,100,1)",.5+.5*Math.sin(g.t*20)); }
  else if(g.k==="chest"){ glow(g.x,g.y+bob,70,"rgba(255,210,90,.9)",.9); C.fillStyle="#8a4a1a"; C.beginPath(); C.arc(g.x,g.y+bob,22,0,TAU); C.fill(); C.strokeStyle="#ffd25f"; C.lineWidth=5; C.stroke();
    C.fillStyle="#ffd25f"; C.fillRect(g.x-3,g.y+bob-22,6,44); C.beginPath(); C.arc(g.x,g.y+bob,6,0,TAU); C.fill(); }
}
function drawHUD(){
  C.lineCap="round";
  const cx=62,cy=62,R=40;
  C.lineWidth=10; C.strokeStyle="rgba(0,0,0,.4)"; C.beginPath(); C.arc(cx,cy,R,0,TAU); C.stroke();
  const g=C.createLinearGradient(cx-R,cy,cx+R,cy); g.addColorStop(0,"#5ff0ff"); g.addColorStop(1,"#a97bff");
  C.strokeStyle=g; C.beginPath(); C.arc(cx,cy,R,-Math.PI/2,-Math.PI/2+TAU*Math.min(1,P.xp/P.need)); C.stroke();
  C.fillStyle="rgba(20,10,60,.75)"; C.beginPath(); C.arc(cx,cy,R-8,0,TAU); C.fill();
  C.fillStyle="#fff"; C.font="28px 'Titan One'"; C.textAlign="center"; C.textBaseline="middle"; C.fillText(P.lvl,cx,cy+1);
  C.font="bold 11px Fredoka"; C.fillStyle="#cdb8ff"; C.fillText("LEVEL",cx,cy+R+20);
  // HP pips
  const n=Math.min(30,Math.ceil(P.maxHp/20)), per=P.maxHp/n;
  for(let i=0;i<n;i++){ const f=clamp((P.hp-i*per)/per,0,1), x=126+(i%10)*26, y=40+Math.floor(i/10)*26;
    C.fillStyle="rgba(0,0,0,.4)"; C.beginPath(); C.arc(x,y,10.5,0,TAU); C.fill(); if(f>0) orb(x,y,10*Math.sqrt(f)+1,"#ffc0d0","#ff4f7e","#b0124a"); }
  const rowY=40+Math.ceil(n/10)*26+8;
  C.textAlign="left"; C.fillStyle="#fff"; C.font="bold 17px Fredoka";
  C.fillText(`⏱ ${Math.floor(time/60)}:${String(Math.floor(time%60)).padStart(2,"0")}   ✿ ${kills}   🪙 ${runCoins}`,120,rowY);
  // weapon / passive slots
  let sx=24;
  const slot=(def,lv,y)=>{ C.fillStyle="rgba(20,10,60,.7)"; C.beginPath(); C.arc(sx,y,15,0,TAU); C.fill(); C.strokeStyle=def.col; C.lineWidth=3; C.beginPath(); C.arc(sx,y,15,0,TAU); C.stroke();
    C.fillStyle=def.col; C.font="bold 15px Fredoka"; C.textAlign="center"; C.fillText(def.icon,sx,y+1);
    for(let i=0;i<lv;i++){ C.fillStyle="#fff"; C.beginPath(); C.arc(sx-8+i*4,y+21,1.6,0,TAU); C.fill(); } sx+=38; };
  for(const id in P.weapons) slot(WEAPONS[id],P.weapons[id],122);
  sx=24; for(const id in P.passives) slot(PASSIVES[id],P.passives[id],162);
  C.textBaseline="alphabetic"; C.textAlign="left";
  // boss bar
  for(const e of enemies){ if(!e.t.startsWith("boss")||e.dead) continue;
    const bw=Math.min(360,W-40), bx=W/2-bw/2, by=18;
    C.fillStyle="rgba(0,0,0,.5)"; C.beginPath(); C.arc(bx,by+7,10,0,TAU); C.arc(bx+bw,by+7,10,0,TAU); C.fill(); C.fillRect(bx,by-3,bw,20);
    const f=Math.max(0,e.hp/e.max), gg=C.createLinearGradient(bx,0,bx+bw,0); gg.addColorStop(0,"#ff5f3a"); gg.addColorStop(1,"#ffd25f");
    C.fillStyle=gg; C.beginPath(); C.arc(bx,by+7,7,0,TAU); C.fill(); C.fillRect(bx,by,bw*f,14); C.beginPath(); C.arc(bx+bw*f,by+7,7,0,TAU); C.fill();
    const sx2=(e.x-cam.x)*Z+W/2, sy2=(e.y-cam.y)*Z+H/2;
    if(sx2<0||sx2>W||sy2<0||sy2>H){ const a=Math.atan2(e.y-P.y,e.x-P.x), ax=W/2+Math.cos(a)*Math.min(W,H)*.42, ay=H/2+Math.sin(a)*Math.min(W,H)*.42;
      glow(ax,ay,34,"rgba(255,170,60,.8)"); C.fillStyle="#ffd25f"; C.beginPath(); C.arc(ax,ay,10,0,TAU); C.fill(); }
    break; }
  if(banner){ const a=clamp(Math.min(banner.t,.5)*2,0,1)*clamp((3.2-banner.t)*4,0,1)||clamp(banner.t*2,0,1); C.globalAlpha=Math.min(1,a+.2);
    C.textAlign="center"; C.font="44px 'Titan One'"; C.lineWidth=8; C.strokeStyle="rgba(20,0,40,.8)"; C.strokeText(banner.txt,W/2,H*.24); C.fillStyle="#ffd25f"; C.fillText(banner.txt,W/2,H*.24);
    if(banner.sub){ C.font="bold 20px Fredoka"; C.fillStyle="#fff"; C.fillText(banner.sub,W/2,H*.24+30); } C.globalAlpha=1; C.textAlign="left"; }
  if(save.tut<3&&time<9&&state==="play"){ C.textAlign="center"; C.font="bold 20px Fredoka"; C.fillStyle="rgba(255,255,255,"+(.9-time/12)+")";
    C.fillText("Move: WASD / drag   •   Dash: SPACE   •   Weapons fire automatically",W/2,H-60); C.textAlign="left"; }
  if(ptr.down&&ptr.touch){ C.strokeStyle="rgba(255,255,255,.3)"; C.lineWidth=3; C.beginPath(); C.arc(ptr.sx,ptr.sy,60,0,TAU); C.stroke();
    C.fillStyle="rgba(255,255,255,.35)"; C.beginPath(); C.arc(ptr.sx+clamp(ptr.x-ptr.sx,-60,60),ptr.sy+clamp(ptr.y-ptr.sy,-60,60),26,0,TAU); C.fill(); }
}
let lastDashPct=-1;
function render(){
  C=ctx; ctx.setTransform(DPR,0,0,DPR,0,0);
  drawBackground();
  ctx.save();
  const sx=shake?rand(-shake,shake)*.5:0, sy=shake?rand(-shake,shake)*.5:0;
  ctx.translate(W/2,H/2); ctx.scale(Z,Z); ctx.translate(-cam.x+sx,-cam.y+sy);
  drawArena();
  for(const g of pickups) drawPickup(g);
  drawWeaponsFx();
  for(const r of rings){ ctx.strokeStyle=`rgba(${r.c},${Math.max(0,r.l)*.8})`; ctx.lineWidth=6*r.l+1; ctx.beginPath(); ctx.arc(r.x,r.y,r.r,0,TAU); ctx.stroke(); }
  for(const e of enemies) drawEnemy(e);
  for(const b of ebul){ if(!vis(b.x,b.y,30)) continue; glow(b.x,b.y,28,"rgba(255,70,120,.9)",.9); orb(b.x,b.y,b.r,"#fff","#ff7aa0","#c0123a"); }
  if(state!=="over") drawPlayer();
  for(const p of parts){ const a=p.l/p.m; ctx.globalAlpha=a; ctx.fillStyle=p.c; ctx.beginPath(); ctx.arc(p.x,p.y,p.s*a+.5,0,TAU); ctx.fill(); }
  ctx.globalAlpha=1;
  ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.lineJoin="round";
  for(const t of texts){ ctx.globalAlpha=clamp(t.l*2,0,1); ctx.font=`${t.s}px "Titan One"`; ctx.lineWidth=4; ctx.strokeStyle="rgba(20,0,40,.8)"; ctx.strokeText(t.t,t.x,t.y); ctx.fillStyle=t.c; ctx.fillText(t.t,t.x,t.y); }
  ctx.globalAlpha=1; ctx.textBaseline="alphabetic"; ctx.textAlign="left";
  ctx.restore();
  const v=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.35,W/2,H/2,Math.max(W,H)*.75);
  v.addColorStop(0,"rgba(0,0,0,0)"); v.addColorStop(1,P&&P.hurt>0?"rgba(255,30,80,.45)":"rgba(0,0,10,.5)");
  ctx.fillStyle=v; ctx.fillRect(0,0,W,H);
  if(flash>0){ ctx.globalAlpha=flash*.7; ctx.fillStyle="#fff"; ctx.fillRect(0,0,W,H); ctx.globalAlpha=1; }

  if(state==="play"||state==="paused"){ const pct=Math.round(100*(1-P.dashCd/1.6)); if(pct!==lastDashPct){ lastDashPct=pct; $("dashBtn").style.setProperty("--p",pct); } }
}

/* ================================================================ loop */
let last=performance.now(), menuEnemies=null;
function menuScene(dt){
  if(!menuEnemies){ menuEnemies=[]; const ts=["slime","spiky","tank","bat","splitter","shooter","dasher","slime","spiky","bat"];
    ts.forEach((t,i)=>{ const e=spawnAt(t,0,0); e.mi=i; e.mr=190+(i%3)*80; menuEnemies.push(e); }); enemies=[]; }
  enemies=menuEnemies;
  for(const e of enemies){ e.ph+=dt*6; e.rot+=dt; const a=clock*.22*(e.mi%2?1:-1)+e.mi*TAU/10; e.x=Math.cos(a)*e.mr; e.y=Math.sin(a)*e.mr*.85; }
  cam.x=0; cam.y=0; P.x=0; P.y=0; P.look=Math.sin(clock*.7)*3; P.yaw=Math.sin(clock*.5)*.55;
  if(wst&&wst.petals) wst.petals.ang+=dt*2;
}
function frame(now){
  const dt=Math.min(.05,(now-last)/1000); last=now; clock+=dt;
  if(state==="play"){ if(!document.hidden) update(dt); }
  else if(state==="menu"||state==="select"){ P.weapons=P.weapons||{}; menuScene(dt); }
  else if(state==="over"){ for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt;} parts=parts.filter(p=>p.l>0); shake=Math.max(0,shake-dt*30); }
  render();
  if(state==="select") drawPortraits();
  requestAnimationFrame(frame);
}
document.addEventListener("visibilitychange",()=>{ if(document.hidden) pause(); });

/* ================================================================ boot */
(async()=>{
  CG.loadingStart();

  CG.loadingStop();

})();
})();
